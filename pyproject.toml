[project]
name = "quests"
version = "0.1.0"
description = "Game-journal style task manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "alembic>=1.18.5",
]

[project.scripts]
quests-server = "quests.main:run"
quests-migrate = "quests.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quests"]

[tool.hatch.build.targets.wheel.sources]
"src/quests" = "quests"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28",
    "ruff>=0.8",
]
