[project]
name = "quests"
version = "0.1.0"
description = "Game-journal style task manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "alembic>=1.18.5",
    "aiogram>=3.30.0",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.11.0",
    "cursor-sdk>=1.0.26",
    "python-dotenv>=1.2.2",
    "faster-whisper>=1.2.1",
    "mcp>=2.0.0",
]

[project.scripts]
quests = "quests.cli:main"
quests-migrate = "quests.migrate:main"
quests-telegram = "quests.telegram.main:main"
quests-mcp = "quests.mcp_server:main"
quests-llm = "quests.llm.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quests"]

[tool.hatch.build.targets.wheel.sources]
"src/quests" = "quests"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "ruff>=0.8",
]
