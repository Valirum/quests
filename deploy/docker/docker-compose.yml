# Quests — Docker Compose (server: api + bot + frontend)
#
#   cd /path/to/Quests
#   cp .env.example .env   # fill TG_* if using bot
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
#
# HUD: not in Docker — scripts/run-overlay-smoke.sh + quests-overlay.service

name: quests

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: api
    image: quests-api:local
    container_name: quests-api
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_HOST: "0.0.0.0"
      QUESTS_PORT: "8765"
      QUESTS_RELOAD: "0"
    volumes:
      - quests-data:/app/data
    ports:
      - "${QUESTS_PUBLISH_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # host network: proxy on 127.0.0.1:12334 is reachable (bridge → host.docker.internal is not)
  bot:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: bot
    image: quests-bot:local
    container_name: quests-bot
    restart: unless-stopped
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_API: http://127.0.0.1:${QUESTS_PUBLISH_PORT:-8765}
      QUESTS_TG_PROXY: ${QUESTS_TG_PROXY:-http://127.0.0.1:12334}
    volumes:
      - quests-data:/app/data

  # Nginx front door: SPA + /api + /ws → api
  frontend:
    image: nginx:1.27-alpine
    container_name: quests-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${QUESTS_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  quests-data:
