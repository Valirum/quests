# Quests — Docker Compose
#
#   cd /path/to/Quests
#   cp .env.example .env   # fill TG_* if using bot
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
#
# Profiles:
#   (default)  api + bot + frontend (nginx → api)
#   --profile hud   + Wayland overlay (Linux workstation only)

name: quests

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: api
    image: quests-api:local
    container_name: quests-api
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_HOST: "0.0.0.0"
      QUESTS_PORT: "8765"
      QUESTS_RELOAD: "0"
    volumes:
      - quests-data:/app/data
    ports:
      - "${QUESTS_PUBLISH_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  bot:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: bot
    image: quests-bot:local
    container_name: quests-bot
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_API: http://api:8765
      # Host-side HTTP proxy. Override in .env if needed.
      QUESTS_TG_PROXY: ${QUESTS_TG_PROXY:-http://host.docker.internal:12334}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - quests-data:/app/data

  # Nginx front door: SPA + /api + /ws → api
  frontend:
    image: nginx:1.27-alpine
    container_name: quests-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${QUESTS_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Experimental Wayland HUD (same machine as the compositor).
  overlay:
    profiles: ["hud"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.overlay
    image: quests-overlay:local
    container_name: quests-overlay
    restart: unless-stopped
    network_mode: host
    environment:
      QUESTS_API: ${QUESTS_API:-http://127.0.0.1:8765}
      QUESTS_WEB_URL: ${QUESTS_WEB_URL:-http://127.0.0.1:8765}
      QUESTS_DATA_DIR: /app/data
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-1}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}
      - ../../data:/app/data

volumes:
  quests-data:
