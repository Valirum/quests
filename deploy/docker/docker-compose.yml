# Quests — Docker Compose (server: api + bot + frontend)
#
#   cd /path/to/Quests
#   cp .env.example .env   # fill TG_* ; QUESTS_*_IMAGE for GHCR
#
# Важно: -f deploy/docker/... сам по себе НЕ читает корневой .env для
# подстановки ${QUESTS_API_IMAGE}. Всегда передавай --env-file:
#
#   docker compose --env-file .env -f deploy/docker/docker-compose.yml up -d --build
#   docker compose --env-file .env -f deploy/docker/docker-compose.yml pull
#
# HUD: not in Docker — scripts/run-overlay-smoke.sh + quests-overlay.service

name: quests

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: api
    image: ${QUESTS_API_IMAGE:-quests-api:local}
    container_name: quests-api
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_HOST: "0.0.0.0"
      QUESTS_PORT: "8765"
      QUESTS_RELOAD: "0"
      QUESTS_LLM_SERVICE_URL: http://llm:8766
    volumes:
      - quests-data:/app/data
    ports:
      - "${QUESTS_PUBLISH_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Action-batch assistant (text -> Groq -> quest actions), its own small
  # long-lived process — keeps the Groq-proxy networking need (see
  # extra_hosts below) off the main api container.
  llm:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: llm
    image: ${QUESTS_LLM_IMAGE:-quests-llm:local}
    container_name: quests-llm
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUESTS_ROOT: /app
      QUESTS_API: http://api:8765
      QUESTS_LLM_HOST: "0.0.0.0"
      QUESTS_LLM_SERVICE_PORT: "8766"
      # bridge network can't reach 127.0.0.1:12334 on the host directly —
      # host.docker.internal (via extra_hosts below) is the bridge-safe way in.
      QUESTS_LLM_PROXY: ${QUESTS_LLM_PROXY:-http://host.docker.internal:12334}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy

  # host network: proxy on 127.0.0.1:12334 is reachable (bridge → host.docker.internal is not)
  bot:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: bot
    image: ${QUESTS_BOT_IMAGE:-quests-bot:local}
    container_name: quests-bot
    restart: unless-stopped
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      QUESTS_ROOT: /app
      QUESTS_DATA_DIR: /app/data
      QUESTS_API: http://127.0.0.1:${QUESTS_PUBLISH_PORT:-8765}
      QUESTS_TG_PROXY: ${QUESTS_TG_PROXY:-http://127.0.0.1:12334}
      # QUESTS_WHISPER_* from env_file (.env): small|medium|large — app default small
    volumes:
      - quests-data:/app/data

  # Nginx front door: SPA + /api + /ws → api
  frontend:
    image: nginx:1.27-alpine
    container_name: quests-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${QUESTS_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  quests-data:
