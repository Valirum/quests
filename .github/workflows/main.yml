name: CI

# Quote "on": YAML 1.1 treats bare `on` as boolean true; that can leave push
# unregistered while Actions UI still allows manual workflow_dispatch.
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_api:
        description: Force rebuild/push quests-api
        type: boolean
        default: false
      force_bot:
        description: Force rebuild/push quests-bot
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      bot: ${{ steps.filter.outputs.bot }}
    steps:
      # depth 1 (checkout default) breaks push diffs → filters stay false,
      # so build-* only run via workflow_dispatch force_* inputs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            api:
              - 'go/**'
              - 'frontend/**'
              - 'alembic/**'
              - 'alembic.ini'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'README.md'
              - 'deploy/docker/Dockerfile'
              - 'deploy/docker/docker-bake.hcl'
              - 'deploy/docker/entrypoint-api.sh'
              - 'deploy/docker/nginx.conf'
              - 'deploy/docker/docker-compose.yml'
            bot:
              # Bot image runs telegram + STT/LLM draft only; shared API code is via HTTP.
              - 'src/quests/telegram/**'
              - 'src/quests/llm/**'
              - 'src/quests/stt/**'
              - 'src/quests/mcp_server.py'
              - 'src/quests/cli.py'
              - 'src/quests/config.py'
              - 'src/quests/envload.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'deploy/docker/Dockerfile'
              - 'deploy/docker/docker-bake.hcl'
              - 'deploy/docker/entrypoint-bot.sh'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go build + test
        working-directory: go
        run: |
          go build ./...
          go test ./...

      - name: Sync + pytest
        run: |
          uv sync --locked --group dev --all-extras
          uv run pytest

  # One BuildKit session → api+bot share python-base layer digests on GHCR.
  build-images:
    needs: [changes, test]
    if: |
      github.event_name != 'pull_request' &&
      needs.test.result == 'success' &&
      (
        needs.changes.outputs.api == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.bot == 'true' ||
        (github.event_name == 'workflow_dispatch' && (inputs.force_api || inputs.force_bot))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Image names + bake targets
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "API_IMAGE=ghcr.io/${owner}/quests-api" >> "$GITHUB_ENV"
          echo "BOT_IMAGE=ghcr.io/${owner}/quests-bot" >> "$GITHUB_ENV"

          targets=()
          want_api=false
          want_bot=false
          if [ "${{ needs.changes.outputs.api }}" = "true" ] \
            || [ "${{ needs.changes.outputs.frontend }}" = "true" ] \
            || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_api }}" = "true" ]; }; then
            want_api=true
          fi
          if [ "${{ needs.changes.outputs.bot }}" = "true" ] \
            || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_bot }}" = "true" ]; }; then
            want_bot=true
          fi

          $want_api && targets+=(api)
          $want_bot && targets+=(bot)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No bake targets resolved" >&2
            exit 1
          fi
          # CSV for bake-action
          IFS=,
          echo "targets=${targets[*]}" >> "$GITHUB_OUTPUT"
          echo "Baking: ${targets[*]}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/bake-action@v6
        with:
          source: .
          files: deploy/docker/docker-bake.hcl
          targets: ${{ steps.meta.outputs.targets }}
          push: true
          vars: |
            API_IMAGE=${{ env.API_IMAGE }}
            BOT_IMAGE=${{ env.BOT_IMAGE }}
            TAG=${{ github.sha }}
          set: |
            *.cache-from=type=gha,scope=quests
            *.cache-to=type=gha,mode=max,scope=quests

  # Replaces Watchtower's poll-and-swap: an explicit step at the end of a
  # green run on main, instead of the server discovering new images on its
  # own schedule. The SSH key used here is forced (in the server's
  # authorized_keys) to run only deploy/docker/ci-deploy.sh — a leaked key
  # can redeploy from origin/main, nothing else. See docs/deploy-ssh.md.
  deploy:
    needs: build-images
    # A job with an explicit `if:` stops inheriting the implicit "needs
    # succeeded" gate, so it's spelled out here — otherwise this would also
    # run when build-images was skipped (no relevant paths changed).
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: SSH deploy
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}"
