name: Android

"on":
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # softprops/action-gh-release needs this to publish a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the SDK, licenses accepted, build-tools/platform matching
      # compileSdk/targetSdk in app/build.gradle.kts resolved automatically.
      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode release keystore
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.QUESTS_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "QUESTS_RELEASE_KEYSTORE_B64 secret is not set — see android/README.md" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/quests-release.jks"

      - name: assembleRelease
        working-directory: android
        env:
          QUESTS_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/quests-release.jks
          QUESTS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.QUESTS_RELEASE_KEYSTORE_PASSWORD }}
          QUESTS_RELEASE_KEY_ALIAS: ${{ secrets.QUESTS_RELEASE_KEY_ALIAS }}
          QUESTS_RELEASE_KEY_PASSWORD: ${{ secrets.QUESTS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PqcVersionCode=${{ github.run_number }} --console=plain

      - name: Read versionName
        id: version
        working-directory: android
        run: |
          name=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/quests-hud-${{ steps.version.outputs.name }}-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: quests-hud-apk
          path: android/dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: Quests HUD ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          files: android/dist/*.apk
          generate_release_notes: true
